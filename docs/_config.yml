title: FlowForge Documentation
description: >-
  The open-source, high-performance integration platform.
  ETL, Reverse ETL, MCP Servers, and Embedded iPaaS — powered by Temporal.io durable execution.
baseurl: "/durable-integrations"
url: "https://jbeck018.github.io"

remote_theme: just-the-docs/just-the-docs@v0.10.0

permalink: pretty

aux_links:
  "GitHub":
    - "https://github.com/jbeck018/durable-integrations"

nav_sort: case_insensitive
heading_anchors: true

callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

color_scheme: light

search_enabled: true
search.heading_level: 3

footer_content: >-
  FlowForge is licensed under <a href="https://github.com/jbeck018/durable-integrations/blob/main/LICENSE">Apache 2.0</a>.

back_to_top: true
back_to_top_text: "Back to top"

plugins:
  - jekyll-seo-tag

exclude:
  - architecture/system-architecture.md
  - architecture/temporal-patterns.md
  - architecture/directory-structure.md
  - guides/connector-development.md
  - guides/deployment.md
  - guides/embedded-ipaas.md
  - guides/mcp-framework.md
