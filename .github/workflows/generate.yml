name: Proto Generate

on:
  push:
    paths:
      - 'proto/**/*.proto'
      - 'buf.gen.yaml'
      - 'buf.yaml'
  pull_request:
    paths:
      - 'proto/**/*.proto'
      - 'buf.gen.yaml'
      - 'buf.yaml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: 'latest'

      - name: Install Go proto plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go@latest

      - name: Install TypeScript proto plugins
        run: cd packages/proto-ts && npm install

      - name: Add TS plugin binaries to PATH
        run: echo "${{ github.workspace }}/packages/proto-ts/node_modules/.bin" >> $GITHUB_PATH

      - name: Update buf dependencies
        run: buf dep update

      - name: Lint proto files
        run: buf lint

      - name: Generate code
        run: buf generate

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain gen/ packages/proto-ts/src/gen/)" ]; then
            echo "Generated code is out of date. Run 'buf generate' and commit the results."
            git diff --stat gen/ packages/proto-ts/src/gen/
            exit 1
          fi
