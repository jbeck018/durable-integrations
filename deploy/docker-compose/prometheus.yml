global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "flowforge-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["flowforge-api:8080"]
        labels:
          service: "flowforge-api"
          environment: "development"

  - job_name: "flowforge-worker"
    metrics_path: /metrics
    static_configs:
      - targets: ["flowforge-worker:9091"]
        labels:
          service: "flowforge-worker"
          environment: "development"

  - job_name: "flowforge-mcp-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["flowforge-mcp-gateway:8090"]
        labels:
          service: "flowforge-mcp-gateway"
          environment: "development"
