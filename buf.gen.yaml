version: v2
inputs:
  - directory: proto
plugins:
  # Go protobuf types
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  # Go gRPC stubs
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
  # Connect-Go handlers (serves JSON/HTTP and gRPC from same handler)
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt: paths=source_relative
  # TypeScript types + Connect service stubs (Protobuf-ES v2 includes Connect codegen)
  - local: protoc-gen-es
    out: packages/proto-ts/src/gen
    opt: target=ts
  # TanStack Query hooks from proto
  - local: protoc-gen-connect-query
    out: packages/proto-ts/src/gen
    opt: target=ts
  # OpenAPI spec from proto (for external docs + Zod generation)
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: gen/openapi
    opt:
      - allow_merge=true
      - merge_file_name=flowforge
